<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SirJi Cafe - Admin Reviews</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f5f1eb;
            color: #3d281c;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .review {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
        }

        .stars {
            color: #d89b32;
            font-size: 20px;
        }

        .review-text {
            margin: 15px 0;
            line-height: 1.6;
        }

        .date {
            font-size: 13px;
            color: #888;
        }

        .delete-btn {
            border: none;
            background: #c0392b;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #962d22;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 30px;
        }

        @media(max-width: 600px) {

            body {
                padding: 15px;
            }

            .review-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .delete-btn {
                width: 100%;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1>☕ SirJi Cafe - Review Manager</h1>

    <div id="reviews">
        <div class="loading">
            Loading reviews...
        </div>
    </div>

</div>


<script>

async function loadReviews() {

    const container = document.getElementById("reviews");

    try {

        const response = await fetch("/api/reviews");

        if (!response.ok) {
            throw new Error("Could not load reviews");
        }

        const reviews = await response.json();

        container.innerHTML = "";

        if (reviews.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    No reviews yet.
                </div>
            `;

            return;
        }

        reviews.forEach(review => {

            const stars =
                "★".repeat(review.rating) +
                "☆".repeat(5 - review.rating);

            const div = document.createElement("div");

            div.className = "review";

            div.innerHTML = `

                <div class="review-header">

                    <div>

                        <div class="name">
                            ${escapeHtml(review.name)}
                        </div>

                        <div class="stars">
                            ${stars}
                        </div>

                    </div>

                    <button
                        class="delete-btn"
                        onclick="deleteReview(${review.id})">

                        Delete

                    </button>

                </div>

                <div class="review-text">
                    "${escapeHtml(review.review)}"
                </div>

                <div class="date">
                    ${escapeHtml(review.date)}
                </div>

            `;

            container.appendChild(div);

        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Could not load reviews.
            </div>
        `;

    }

}


async function deleteReview(id) {

    const confirmDelete = confirm(
        "Are you sure you want to delete this review?"
    );

    if (!confirmDelete) {
        return;
    }

    try {

        const response = await fetch(
            `/api/reviews/${id}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Delete failed"
            );
        }

        alert("Review deleted successfully.");

        loadReviews();

    } catch (error) {

        console.error(error);

        alert(
            "Could not delete review."
        );

    }

}


function escapeHtml(value) {

    const div = document.createElement("div");

    div.textContent = value;

    return div.innerHTML;
}


loadReviews();

</script>

</body>

</html>
